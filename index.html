<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Card" id="loginCard">
        <h1 class="CardH1">Login</h1>

        <div class="UsernameCard">
            <p class="CardP" id="us">Username</p>
            <input type="text" class="CardInput" placeholder="Username" id="usernameInputLogin">
        </div>

        <div class="PasswordCard">
            <p class="CardP">Password</p>
            <input type="password" class="CardInput" placeholder="Password" id="passwordInputLogin">
        </div>

        <button class="Confirm" id="confirmButtonLogin">Confirm</button>

        <p class="LoginCardP" id="ChangeSignUp">Sign Up</p>
    </div>

    <div class="Card" id="signupCard">
        <h1 class="CardH1">Sign Up</h1>

        <div class="UsernameCard">
            <p class="CardP">Create Username</p>
            <input type="text" class="CardInput" placeholder="Username" id="usernameInputSignup">
        </div>

        <div class="PasswordCard">
            <p class="CardP">Create Password</p>
            <input type="password" class="CardInput" placeholder="Password" id="passwordInputSignup">
        </div>

        <button class="Confirm" id="confirmButtonSignup">Confirm</button>

        <p class="CardP" id="ChangeLogin">Login</p>
    </div>

    <script src="main.js"></script>
</body>
</html>
